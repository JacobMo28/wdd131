<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect 4</title>
    <link rel="stylesheet" href="index.css">
    <script src="app.js" defer></script>
</head>
<body>
    <!-- <h1>Connect 4</h1> -->
     <img src="Connect4Logo.png" alt="Connect-4 Logo">
    <p id="status"></p>
    <button id="restart">Reset</button>
<div id="game">

    <div class="player-card">
        <h2 id="player1-turn">Your turn</h2>

        <div class="player-piece player1"></div>

        <h2>-- Player 1 --</h2>
        <p id="player1-wins">Wins: 0</p>
    </div>

    <div id="center">
        <div id="board"></div>

    </div>

    <div class="player-card">
        <h2 id="player2-turn">Your turn</h2>

        <div class="player-piece player2"></div>

        <h2>-- Player 2 --</h2>
        <p id="player2-wins">Wins: 0</p>
    </div>

</div>
</body>
</html>
