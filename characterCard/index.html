<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link href="styles.css" rel="stylesheet">
    <script src="index.js" defer></script>


    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Monkey Character card">
    <meta property="og:description" content="monke description banana">
    <meta property="og:url" content="https://jacobmo28.github.io/wdd131/characterCard/index.html">
    <meta property="og:image" content="monkey-thinking-monkey.gif">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Monkey Character Card">
    <meta name="twitter:description" content="monke description banana">
    <meta name="twitter:image" content="monkey-thinking-monkey.gif">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/eventform/Untitled design (1).png">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/eventform/Untitled design (1).png">



</head>
<body>
    <div class="card">
        <img class="image" src="monkey-thinking-monkey.gif" alt="Snortleblat">

        <h2 class="name">Don</h2>

        <div class="stats">
            <p><strong>Class:</strong> Monkey</p>
            <p><strong>Level:</strong> <span id="level">5</span></p>
            <p><strong>Health:</strong> <span id="health">100</span></p>
        </div>

        <div class="buttons">
            <button id="attackBtn">Attack</button>
            <button id="levelUpBtn">Level Up</button>
        </div>
    </div>


    
</body>
</html>
